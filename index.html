<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Money Manager</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Money Manager</p>
          <h1>资产控制台</h1>
          <p class="muted">本地优先的个人资产台账</p>
        </div>
        <div class="toolbar" aria-label="资产工具栏">
          <button class="tool-button" id="refresh-market" type="button">
            <span class="icon" data-icon="refresh" aria-hidden="true"></span>
            刷新行情
          </button>
          <button class="tool-button" id="export-data" type="button">
            <span class="icon" data-icon="download" aria-hidden="true"></span>
            导出
          </button>
          <label class="tool-button file-trigger" for="import-data">
            <span class="icon" data-icon="upload" aria-hidden="true"></span>
            导入
          </label>
          <input id="import-data" type="file" accept="application/json" />
        </div>
      </header>

      <main>
        <section class="summary-grid" aria-label="资产概览">
          <article class="stat-card">
            <span>净资产</span>
            <strong id="net-worth">--</strong>
            <small id="net-worth-sub">--</small>
          </article>
          <article class="stat-card">
            <span>资产总额</span>
            <strong id="gross-assets">--</strong>
            <small id="gross-assets-sub">--</small>
          </article>
          <article class="stat-card">
            <span>负债</span>
            <strong id="liabilities">--</strong>
            <small id="liabilities-sub">--</small>
          </article>
          <article class="stat-card">
            <span>今日浮动</span>
            <strong id="day-change">--</strong>
            <small id="day-change-sub">--</small>
          </article>
        </section>

        <section class="control-band" aria-label="筛选和币种">
          <div>
            <span class="control-label">基准币种</span>
            <div class="segmented" id="base-currency"></div>
          </div>
          <label>
            <span class="control-label">搜索</span>
            <input id="asset-search" type="search" placeholder="资产、机构或备注" />
          </label>
          <label>
            <span class="control-label">类型</span>
            <select id="type-filter"></select>
          </label>
          <label>
            <span class="control-label">流动性</span>
            <select id="liquidity-filter"></select>
          </label>
        </section>

        <section class="workspace-grid">
          <aside class="asset-editor" aria-label="资产编辑">
            <div class="section-heading">
              <div>
                <p class="eyebrow">Entry</p>
                <h2 id="form-title">新增资产</h2>
              </div>
              <button class="icon-button" id="clear-form" type="button" title="清空表单" aria-label="清空表单">
                <span class="icon" data-icon="x" aria-hidden="true"></span>
              </button>
            </div>

            <form id="asset-form">
              <label>
                <span>资产名称</span>
                <input id="asset-name" name="name" type="text" required maxlength="40" placeholder="例如：招商银行活期" />
              </label>

              <div class="form-pair">
                <label>
                  <span>类型</span>
                  <select id="asset-type" name="type" required></select>
                </label>
                <label>
                  <span>币种</span>
                  <select id="asset-currency" name="currency" required></select>
                </label>
              </div>

              <label>
                <span>机构</span>
                <input id="asset-institution" name="institution" type="text" maxlength="40" placeholder="银行、券商、钱包" />
              </label>

              <div class="form-pair">
                <label>
                  <span>数量</span>
                  <input id="asset-quantity" name="quantity" type="number" min="0" step="0.000001" required />
                </label>
                <label>
                  <span>现价</span>
                  <input id="asset-price" name="price" type="number" min="0" step="0.000001" required />
                </label>
              </div>

              <div class="form-pair">
                <label>
                  <span>成本单价</span>
                  <input id="asset-cost" name="costBasis" type="number" min="0" step="0.000001" />
                </label>
                <label>
                  <span>今日涨跌 %</span>
                  <input id="asset-day-change" name="dayChangePct" type="number" step="0.01" />
                </label>
              </div>

              <div class="form-pair">
                <label>
                  <span>流动性</span>
                  <select id="asset-liquidity" name="liquidity"></select>
                </label>
                <label>
                  <span>行情源</span>
                  <select id="asset-quote-provider" name="quoteProvider">
                    <option value="manual">手动</option>
                    <option value="coingecko">CoinGecko</option>
                  </select>
                </label>
              </div>

              <label>
                <span>行情标识</span>
                <input id="asset-symbol" name="symbol" type="text" maxlength="60" placeholder="例如：bitcoin" />
              </label>

              <label>
                <span>备注</span>
                <textarea id="asset-note" name="note" rows="3" maxlength="140" placeholder="到期日、风险、用途"></textarea>
              </label>

              <button class="primary-button" id="save-asset" type="submit">
                <span class="icon" data-icon="save" aria-hidden="true"></span>
                保存资产
              </button>
            </form>
          </aside>

          <section class="asset-board" aria-label="资产列表">
            <div class="board-header">
              <div>
                <p class="eyebrow">Portfolio</p>
                <h2>资产明细</h2>
              </div>
              <p class="status-pill" id="market-status">等待同步</p>
            </div>

            <div class="insight-grid">
              <div>
                <span class="control-label">配置</span>
                <div class="allocation">
                  <div class="donut" id="allocation-donut" role="img" aria-label="资产配置图"></div>
                  <div class="allocation-list" id="allocation-list"></div>
                </div>
              </div>
              <div>
                <span class="control-label">观察</span>
                <ul class="insights" id="insights"></ul>
              </div>
            </div>

            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th scope="col">资产</th>
                    <th scope="col">类型</th>
                    <th scope="col">数量</th>
                    <th scope="col">现价</th>
                    <th scope="col">市值</th>
                    <th scope="col">收益</th>
                    <th scope="col">流动性</th>
                    <th scope="col">操作</th>
                  </tr>
                </thead>
                <tbody id="asset-table"></tbody>
              </table>
            </div>
            <div class="empty-state" id="empty-state" hidden>
              <h3>没有匹配的资产</h3>
              <p>调整筛选条件，或新增一笔资产。</p>
            </div>
          </section>
        </section>
      </main>
    </div>

    <template id="icon-template">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="" />
      </svg>
    </template>
    <script src="src/app.js" defer></script>
  </body>
</html>
