plugins {
    id "com.android.application"
}

def moneyManagerDebugKeystore = file("money-manager-debug.p12")
def masterReleaseTag = "android-master-latest"
def devReleaseTag = "android-dev-latest"
def repo = "ComputerAScience/money-manager"

android {
    namespace "com.computerascience.moneymanager"
    compileSdk 35

    defaultConfig {
        applicationId "com.computerascience.moneymanager"
        minSdk 23
        targetSdk 35
        versionCode 48
        versionName "0.6.10"
    }

    buildFeatures {
        buildConfig true
    }

    flavorDimensions "channel"

    productFlavors {
        master {
            dimension "channel"
            manifestPlaceholders = [appLabel: "Money Manager"]
            buildConfigField "String", "CHANNEL", "\"master\""
            buildConfigField "String", "CHANNEL_LABEL", "\"Master\""
            buildConfigField "String", "APK_DOWNLOAD_URL", "\"https://github.com/${repo}/releases/download/${masterReleaseTag}/money-manager-master.apk\""
            buildConfigField "String", "UPDATE_INFO_URL", "\"https://github.com/${repo}/releases/download/${masterReleaseTag}/version.json\""
        }
        dev {
            dimension "channel"
            versionNameSuffix "-dev"
            manifestPlaceholders = [appLabel: "Money Manager Dev"]
            buildConfigField "String", "CHANNEL", "\"dev\""
            buildConfigField "String", "CHANNEL_LABEL", "\"Dev\""
            buildConfigField "String", "APK_DOWNLOAD_URL", "\"https://github.com/${repo}/releases/download/${devReleaseTag}/money-manager-dev.apk\""
            buildConfigField "String", "UPDATE_INFO_URL", "\"https://github.com/${repo}/releases/download/${devReleaseTag}/version.json\""
        }
    }

    signingConfigs {
        if (moneyManagerDebugKeystore.exists()) {
            stableDebug {
                storeFile moneyManagerDebugKeystore
                storePassword "money-manager"
                keyAlias "money-manager-debug"
                keyPassword "money-manager"
                storeType "pkcs12"
            }
        }
    }

    buildTypes {
        debug {
            if (moneyManagerDebugKeystore.exists()) {
                signingConfig signingConfigs.stableDebug
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
