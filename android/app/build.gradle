plugins {
    id "com.android.application"
}

def moneyManagerDebugKeystore = file("money-manager-debug.p12")

android {
    namespace "com.computerascience.moneymanager"
    compileSdk 35

    defaultConfig {
        applicationId "com.computerascience.moneymanager"
        minSdk 23
        targetSdk 35
        versionCode 41
        versionName "0.6.3"
    }

    signingConfigs {
        if (moneyManagerDebugKeystore.exists()) {
            stableDebug {
                storeFile moneyManagerDebugKeystore
                storePassword "money-manager"
                keyAlias "money-manager-debug"
                keyPassword "money-manager"
                storeType "pkcs12"
            }
        }
    }

    buildTypes {
        debug {
            if (moneyManagerDebugKeystore.exists()) {
                signingConfig signingConfigs.stableDebug
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
