name: Build Android APK

on:
  push:
    branches:
      - master
      - codex-asset-dashboard
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
  release:
    types:
      - created

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/money-manager-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: money-manager-debug-apk
          path: android/app/build/outputs/apk/debug/money-manager-debug.apk

      - name: Attach APK to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/money-manager-debug.apk
