name: Build Android APK

on:
  push:
    branches:
      - master
      - codex-asset-dashboard
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    branches:
      - master
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/money-manager-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: money-manager-debug-apk
          path: android/app/build/outputs/apk/debug/money-manager-debug.apk

      - name: Publish latest debug APK release
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="android-debug-latest"
          apk="app/build/outputs/apk/debug/money-manager-debug.apk"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$tag" "$GITHUB_SHA"
          git push -f origin "refs/tags/$tag"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "Latest Android Debug APK" \
              --notes "最新 debug APK。手机可以扫描仓库 README 里的二维码下载。这个 release 会被 GitHub Actions 自动更新。" \
              --prerelease
          fi
          gh release upload "$tag" "$apk" --clobber
